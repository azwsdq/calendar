<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Задачи — Календарь</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <header class="app-header">
        <a class="app-logo" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span class="logo-text">Календарь</span>
        </a>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <nav class="header-nav">
            <a href="/" class="nav-link">Календарь</a>
            <a href="/tasks" class="nav-link nav-link--active">Задачи</a>
            <form action="/logout" method="POST"><button type="submit" class="nav-logout">Выйти</button></form>
        </nav>
    </header>

    <div class="mobile-nav-dropdown" id="mobileNav">
        <a href="/" class="nav-link">Календарь</a>
        <a href="/tasks" class="nav-link nav-link--active">Задачи</a>
        <form action="/logout" method="POST"><button type="submit" class="nav-logout" style="width:100%">Выйти</button></form>
    </div>

    <main class="app-container">
        <div class="month-header">
            <h1 class="month-title">Задачи</h1>
        </div>

        <section class="add-form-card">
            <h2>Новая задача</h2>
            <form class="add-form add-form--tasks" action="/add_task" method="POST">
                <input type="text" name="title" placeholder="Название" required>
                <input type="date" name="due_date" required>
                <input type="text" name="description" placeholder="Описание">
                <button type="submit" class="btn-primary">+ Добавить</button>
            </form>
        </section>

        <section>
            {% if tasks %}
                <div class="task-list">
                    {% for task in tasks %}
                        <article class="task-card{% if task.date < today %} task-card--overdue{% elif task.date == today %} task-card--today{% endif %}" id="task-{{ task.id }}">
                            <div class="task-top-row">
                                <h3 class="task-card__title">{{ task.title }}</h3>
                                <div class="task-actions">
                                    <button class="task-edit-btn" type="button" onclick="openEdit({{ task.id }})" title="Редактировать">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                    </button>
                                    <form action="/delete_task" method="POST" style="display:inline">
                                        <input type="hidden" name="task_id" value="{{ task.id }}">
                                        <button class="task-delete-btn" type="submit" title="Удалить">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <div class="task-meta">
                                <span class="task-due{% if task.date < today %} task-due--overdue{% elif task.date == today %} task-due--today{% endif %}">
                                    {{ task.date.strftime('%d.%m.%Y') }}
                                </span>
                            </div>

                            {% if task.description %}
                                <p class="task-card__desc">{{ task.description }}</p>
                            {% endif %}

                            <form class="task-edit-form" action="/edit_task" method="POST" id="edit-form-{{ task.id }}">
                                <input type="hidden" name="task_id" value="{{ task.id }}">
                                <div class="task-edit-fields">
                                    <input type="text" name="title" value="{{ task.title }}" required>
                                    <input type="date" name="due_date" value="{{ task.date.strftime('%Y-%m-%d') }}" required>
                                    <input type="text" name="description" value="{{ task.description or '' }}">
                                </div>
                                <div class="task-edit-actions">
                                    <button type="submit" class="btn-primary btn-small">Сохранить</button>
                                    <button type="button" class="btn-cancel btn-small" onclick="closeEdit({{ task.id }})">Отмена</button>
                                </div>
                            </form>
                        </article>
                    {% endfor %}
                </div>
            {% else %}
                <div class="tasks-empty"><p>Нет задач</p></div>
            {% endif %}
        </section>
    </main>
    <script src="{{ url_for('static', path='/main.js') }}" defer></script>
</body>
</html>
