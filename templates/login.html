<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Календарь</title>
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Календарь">
    <link rel="manifest" href="{{ url_for('static', path='/manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='/icon-192.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body class="auth-body">
    <main class="auth-card">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Календарь
        </div>
        <h1 class="auth-title">Войти в аккаунт</h1>
        {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
        <form class="auth-form" action="/login" method="POST">
            <div class="auth-field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="you@example.com" value="{{ email or '' }}" required autocomplete="email">
            </div>
            <div class="auth-field">
                <label for="password">Пароль</label>
                <input id="password" type="password" name="password" placeholder="Введите пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary auth-submit">Войти</button>
        </form>
        <p class="auth-switch">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
    </main>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', path='/sw.js') }}")
                    .then(reg => console.log('[SW] Зарегистрирован:', reg.scope))
                    .catch(err => console.log('[SW] Ошибка регистрации:', err));
            });
        }
    </script>
</body>
</html>
