<!DOCTYPE html>
<html>
<head>
    <title>Календарь</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <h1>{{ month_name }} {{ year }}</h1>

    <!-- Форма добавления -->
    <!-- action="/add_event" отправляет данные на сервер -->
    <!-- method="POST" означает запись данных -->
    <form action="/add_event" method="POST">
        <input type="text" name="title" placeholder="Название события" required>
        <input type="date" name="date" required>
        <input type="text" name="description" placeholder="Описание">
        <button type="submit">Добавить событие</button>
    </form>

    <!-- Сетка календаря -->
    <div class="calendar">
        <div class="weekday">Пн</div>
        <div class="weekday">Вт</div>
        <div class="weekday">Ср</div>
        <div class="weekday">Чт</div>
        <div class="weekday">Пт</div>
        <div class="weekday">Сб</div>
        <div class="weekday">Вс</div>

        {% for week in calendar %}
            {% for day in week %}
                <div class="day">
                    {% if day != 0 %}
                        <strong>{{ day }}</strong>
                        {% for item in events_by_day.get(day, []) %}
                                <div class="event" title="{{ item.description }}">
                                <span>{{ item.title }}</span>
                                <form class="event-delete-form" action="/delete_event" method="POST">
                                    <input type="hidden" name="event_id" value="{{ item.id }}">
                                    <input type="hidden" name="year" value="{{ year }}">
                                    <input type="hidden" name="month" value="{{ month }}">
                                    <button class="event-delete" type="submit" title="Удалить" onclick="return confirm('Удалить задачу?');">x</button>
                                </form>
                            </div>
                        {% endfor %}
                    {% endif %}
                </div>
            {% endfor %}
        {% endfor %}
    </div>
</body>
</html>
