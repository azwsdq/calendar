<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Календарь</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Календарь
        </div>

        <h1 class="auth-title">Создать аккаунт</h1>

        {% if error %}
            <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form class="auth-form" action="/register" method="POST" novalidate id="register-form">
            <div class="auth-field">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    value="{{ email or '' }}"
                    required
                    autocomplete="email"
                >
            </div>
            <div class="auth-field">
                <label for="password">Пароль</label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Минимум 8 символов"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >
            </div>
            <div class="auth-field">
                <label for="password_confirm">Подтверждение пароля</label>
                <input
                    id="password_confirm"
                    type="password"
                    name="password_confirm"
                    placeholder="Повторите пароль"
                    required
                    autocomplete="new-password"
                >
                <span class="auth-field-hint" id="confirm-hint"></span>
            </div>
            <button type="submit" class="btn-primary auth-submit">Зарегистрироваться</button>
        </form>

        <p class="auth-switch">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const pw = document.getElementById('password');
        const confirm = document.getElementById('password_confirm');
        const hint = document.getElementById('confirm-hint');

        function checkMatch() {
            if (!confirm.value) { hint.textContent = ''; return; }
            if (pw.value === confirm.value) {
                hint.textContent = 'Пароли совпадают';
                hint.className = 'auth-field-hint auth-field-hint--ok';
            } else {
                hint.textContent = 'Пароли не совпадают';
                hint.className = 'auth-field-hint auth-field-hint--err';
            }
        }

        confirm.addEventListener('input', checkMatch);
        pw.addEventListener('input', checkMatch);

        form.addEventListener('submit', function(e) {
            if (pw.value !== confirm.value) {
                e.preventDefault();
                hint.textContent = 'Пароли не совпадают';
                hint.className = 'auth-field-hint auth-field-hint--err';
                confirm.focus();
            } else if (pw.value.length < 8) {
                e.preventDefault();
                pw.focus();
            }
        });
    </script>
</body>
</html>
